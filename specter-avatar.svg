<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="auroraSpecterGradient" x1="18" y1="18" x2="102" y2="102" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle (avatar container) -->
  <circle cx="60" cy="60" r="58" fill="#14141F" stroke="url(#auroraSpecterGradient)" stroke-width="2" opacity="0.95"/>

  <!-- Ghost body -->
  <g filter="url(#softGlow)">
    <path d="M60 22
             C40 22 26 36 26 56
             L26 88
             C26 92 30 93 33 90
             L40 83
             L48 91
             C50 93 53 93 55 91
             L60 85
             L65 91
             C67 93 70 93 72 91
             L80 83
             L87 90
             C90 93 94 92 94 88
             L94 56
             C94 36 80 22 60 22 Z"
          fill="url(#auroraSpecterGradient)"/>
  </g>

  <!-- Eyes -->
  <ellipse cx="47" cy="55" rx="5" ry="7" fill="#222321"/>
  <ellipse cx="73" cy="55" rx="5" ry="7" fill="#222321"/>
  <!-- Eye glow highlights -->
  <circle cx="48.5" cy="52" r="1.6" fill="#22D3EE"/>
  <circle cx="74.5" cy="52" r="1.6" fill="#22D3EE"/>

  <!-- Small smile -->
  <path d="M52 68 Q60 74 68 68" stroke="#222321" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Little circuit/spark details floating near the ghost -->
  <g stroke="url(#auroraSpecterGradient)" stroke-width="1.5" opacity="0.8">
    <line x1="18" y1="40" x2="24" y2="40"/>
    <line x1="96" y1="45" x2="102" y2="45"/>
  </g>
  <circle cx="16" cy="40" r="2" fill="#22D3EE"/>
  <circle cx="104" cy="45" r="2" fill="#22D3EE"/>
</svg>
